name: Deploy Staging

on:
  push:
    branches: ["feature/admin-cms"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-staging
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.HOSTINGER_STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Astro from the committed CMS snapshot
        working-directory: frontend
        env:
          CMS_ALLOW_STATIC_FALLBACK: "true"
        run: |
          npm ci
          npm run check
          npm run build

      - name: Configure the Hostinger deployment key
        env:
          DEPLOY_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/hostinger_staging
          chmod 600 ~/.ssh/hostinger_staging
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy static files without touching Laravel
        env:
          DEPLOY_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          PUBLIC_ROOT: ${{ secrets.HOSTINGER_PUBLIC_ROOT }}
        run: |
          rsync -az --delete --delay-updates --timeout=60 \
            --exclude='.htaccess' \
            --exclude='index.php' \
            --exclude='storage' \
            --exclude='admin.css' \
            --exclude='css/' \
            --exclude='fonts/' \
            --exclude='js/' \
            --exclude='favicon.ico' \
            -e "ssh -i ~/.ssh/hostinger_staging -p $DEPLOY_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2" \
            frontend/dist/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$PUBLIC_ROOT/"

          ssh -i ~/.ssh/hostinger_staging \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -s '$PUBLIC_ROOT/index.html' && test -s '$PUBLIC_ROOT/sitemap.xml'"
